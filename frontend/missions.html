<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Services - TaskLink</title></head><body data-nav><main><div class="seg"><a href="services.html" class="on">Services</a><a href="missions.html">Do both</a></div>
<h1>Find a service</h1>
<input id="q" placeholder="Ex: logo, how to save money..."><select id="category"><option value="">All categories</option><option value="Design">Design</option><option value="IT">IT</option><option value="Education">Education</option><option value="Sewing">Sewing</option><option value="Photo">Photo</option><option value="Beauty">Beauty</option><option value="Repair">Repair</option><option value="Finance">Finance</option><option value="Business">Business</option><option value="Content">Content</option><option value="Coaching">Coaching</option></select>
<button id="search">Search</button><div id="list"></div>
<h1>Offer a service</h1><form id="add" class="card">
<label>Service name<input name="title" required></label>
<label>Category<select name="category"><option value="Design">Design</option><option value="IT">IT</option><option value="Education">Education</option><option value="Sewing">Sewing</option><option value="Photo">Photo</option><option value="Beauty">Beauty</option><option value="Repair">Repair</option><option value="Finance">Finance</option><option value="Business">Business</option><option value="Content">Content</option><option value="Coaching">Coaching</option></select></label>
<label>Type<select name="kind"><option value="service">Service</option><option value="training">Training</option></select></label>
<label>Description<textarea name="description" required></textarea></label>
<label>Starting price (FCFA)<input type="number" name="price" min="0" required></label>
<button class="green">Add service</button></form></main>
<script src="js/app.js"></script><script src="js/services.js"></script></body></html>
